<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Fondo Gradiente -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Resplandor Neón -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente de Texto -->
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Fondo Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Malla de Líneas Estilo Cyberpunk/Gamer -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ícono Control Gamer -->
  <g transform="translate(536, 110)">
    <path d="M92 20 C70 20 50 35 42 56 L18 126 C10 150 24 176 48 180 C68 183 85 170 91 151 L102 120 L154 120 L165 151 C171 170 188 183 208 180 C232 176 246 150 238 126 L214 56 C206 35 186 20 164 20 Z" fill="#1e293b" stroke="url(#textGlow)" stroke-width="6"/>
    <!-- D-Pad -->
    <rect x="58" y="70" width="12" height="36" rx="3" fill="#38bdf8"/>
    <rect x="46" y="82" width="36" height="12" rx="3" fill="#38bdf8"/>
    <!-- Botones -->
    <circle cx="190" cy="76" r="8" fill="#f43f5e"/>
    <circle cx="204" cy="90" r="8" fill="#10b981"/>
    <circle cx="176" cy="90" r="8" fill="#3b82f6"/>
    <circle cx="190" cy="104" r="8" fill="#eab308"/>
  </g>

  <!-- Texto Principal -->
  <text x="600" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#textGlow)" text-anchor="middle" letter-spacing="2">
    CATÁLOGO GAMER
  </text>

  <!-- Subtítulo -->
  <text x="600" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    Las mejores ofertas en PC, PlayStation, Xbox y Nintendo
  </text>

  <!-- Etiqueta inferior -->
  <rect x="460" y="490" width="280" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="600" y="520" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#38bdf8" text-anchor="middle">
    steneithan.github.io
  </text>
</svg>
